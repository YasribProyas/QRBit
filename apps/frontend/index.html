<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1420" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Scan a QR code. Files appear. No login. No cloud. No trace." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>QRBit</title>
    <!--
      Fonts are self-hosted, not fetched from a CDN. Two reasons, and the first is the product:
      a "No cloud. No trace." tool must not hand every visitor's IP and user agent to Google
      before any of our JavaScript runs. The second is that the CDN route never worked anyway --
      the deployed CSP is `style-src 'self'` with no Google origin, so the remote stylesheet was
      blocked and the app rendered in system fallbacks on every device.
    -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <!-- impeccable-live-start -->
<script>
  (function() {
    if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
      crypto.randomUUID = function() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      };
    }
    var host = window.location.hostname || 'localhost';
    var script = document.createElement('script');
    script.src = 'http://' + host + ':8400/live.js?token=507a0778-f29c-4323-955e-74cf8880ea5f';
    document.body.appendChild(script);
  })();
</script>
<!-- impeccable-live-end -->
</body>
</html>
