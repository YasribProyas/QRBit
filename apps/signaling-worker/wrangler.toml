name = "qrdrop-signaling"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
SESSION_TTL_SECONDS = "300"
# TURN credential lifetime. QRDrop sessions last minutes, not hours, so this is
# deliberately short: a harvested credential's abuse window is bounded by this value.
# Cloudflare's maximum is 172800 (48h); PLAN.md §13's 3600 was a coturn-style default.
TURN_TTL_SECONDS = "600"
# Cloudflare Realtime TURN key identifier (NOT a secret — the secret is the
# TURN_KEY_SECRET secure value, set with `wrangler secret put TURN_KEY_SECRET`).
# Left blank until provisioned: an absent key makes the worker hand out no TURN
# credentials, and clients fall back to STUN-only rather than failing the session.
TURN_KEY_ID = ""

# Origins permitted to call this API. This one value drives THREE behaviours, which is
# why it lives here rather than being duplicated:
#   1. CORS — only an exact-listed Origin is reflected back (never a wildcard, since this
#      endpoint mints session identifiers).
#   2. CSP connect-src on this worker's own responses.
#   3. The pairing contract: the QR encodes the Pages origin, so it must be listed here or
#      the browser blocks the fetch that creates the session.
# Add the custom domain here (comma-separated) when it replaces pages.dev.
ALLOWED_ORIGINS = "https://qrdrop-app.proyas.workers.dev, http://localhost:5173"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDurableObject"

[[migrations]]
tag = "v1"
# SQLite-backed, which the Workers FREE plan requires for Durable Objects (`new_classes`
# is the ephemeral-storage form and the API rejects it outright on a free account).
# PLAN.md §13 already specified SQLite-backed DOs, so this matches the design intent.
# Safe to rewrite rather than append: nothing has been deployed under this tag yet, and
# DO class migrations are append-only once live.
new_sqlite_classes = ["SessionDurableObject"]

# Rate limiting + session-code burn registry (PLAN.md §13, §17).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b93274ce4a89489c92dcb8fa7ce875a7"

# Secrets (never commit):
#   wrangler secret put TURN_KEY_SECRET   # Cloudflare Realtime TURN key secret
